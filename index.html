<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#030914"><title>For You</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030914;color:#fff;font-family:Georgia,'Times New Roman',serif}
.scene{position:relative;width:100%;height:100svh;min-height:520px;overflow:hidden;background:radial-gradient(ellipse at 50% 74%,#071528 0,#040d1b 42%,#020711 100%)}
.stars,.stars:before,.stars:after{position:absolute;inset:0;content:"";pointer-events:none;background-image:radial-gradient(1px 1px at 8% 13%,#fff 90%,transparent),radial-gradient(1px 1px at 22% 34%,#dce8ff 90%,transparent),radial-gradient(1px 1px at 77% 19%,#fff 90%,transparent),radial-gradient(1px 1px at 88% 61%,#dce8ff 90%,transparent),radial-gradient(1px 1px at 48% 12%,#fff 90%,transparent),radial-gradient(1px 1px at 63% 43%,#fff 90%,transparent),radial-gradient(1px 1px at 31% 76%,#dce8ff 90%,transparent),radial-gradient(1px 1px at 93% 87%,#fff 90%,transparent),radial-gradient(1px 1px at 14% 88%,#fff 90%,transparent),radial-gradient(1px 1px at 54% 63%,#dce8ff 90%,transparent);background-size:310px 270px;opacity:.7;animation:twinkle 5s ease-in-out infinite alternate}.stars:before{transform:scale(1.3);opacity:.45;animation-duration:7s}.stars:after{transform:scale(.8);opacity:.55;animation-duration:4s}@keyframes twinkle{from{opacity:.25}to{opacity:.9}}
.glow{position:absolute;width:210px;height:210px;border-radius:50%;background:#d5b65b;filter:blur(90px);opacity:0;bottom:5%;left:50%;transform:translateX(-50%);transition:opacity 2s}.scene.opened .glow{opacity:.15}
.intro{position:absolute;left:0;right:0;top:46%;transform:translateY(-50%);text-align:center;z-index:5;transition:opacity 1s,transform 1s}.intro p{font-size:clamp(11px,2.8vw,14px);letter-spacing:.32em;margin:0 0 28px;color:#f4f1e9;text-shadow:0 0 12px #fff8}.open-btn{border:1px solid #ffffff40;background:#ffffff0b;color:#fff;border-radius:30px;padding:10px 30px;font:11px Georgia,serif;letter-spacing:.08em;min-width:74px;cursor:pointer;box-shadow:0 0 18px #ffffff0a;transition:.3s}.open-btn:active{transform:scale(.94);background:#ffffff20}.scene.opened .intro{opacity:0;transform:translateY(-65%);pointer-events:none}
.message{position:absolute;z-index:4;top:9%;left:0;right:0;text-align:center;opacity:0;transform:translateY(10px);transition:opacity 1.7s,transform 1.7s;padding:0 12px}.message h1{font-weight:normal;font-size:clamp(16px,4vw,23px);letter-spacing:.28em;margin:0;text-shadow:0 0 13px #fff8}.message p{font-size:9px;letter-spacing:.23em;color:#d9dce5;margin-top:16px}.scene.opened .message{opacity:1;transform:translateY(0);transition-delay:1s}
.garden{position:absolute;inset:0;z-index:2;pointer-events:none}.flower{position:absolute;bottom:-8px;width:110px;height:0;transform-origin:bottom;transition:height 3.5s cubic-bezier(.2,.8,.2,1)}.scene.opened .flower{height:var(--h)}.flower .stem{position:absolute;bottom:0;left:50%;width:2px;height:100%;background:linear-gradient(#b9ad79,#315b3d);transform:translateX(-50%);border-radius:100%}.leaf{position:absolute;width:35px;height:13px;background:linear-gradient(130deg,#397c4d,#102e27);border-radius:100% 0 100% 0;bottom:var(--y);left:calc(50% + var(--x));transform:rotate(var(--r));box-shadow:0 0 8px #4c9a5b33}.bloom{position:absolute;left:50%;top:-4px;width:12px;height:12px;transform:translate(-50%,-50%) scale(0);transition:transform 1s 2.8s}.scene.opened .bloom{transform:translate(-50%,-50%) scale(1)}.petal{position:absolute;left:50%;top:50%;width:12px;height:19px;margin:-17px 0 0 -6px;border-radius:60% 60% 45% 45%;background:linear-gradient(90deg,#bdbba6,#fffef0 50%,#d9d5bc);transform-origin:50% 17px;box-shadow:0 0 9px #fff9}.petal:nth-child(1){transform:rotate(0deg)}.petal:nth-child(2){transform:rotate(60deg)}.petal:nth-child(3){transform:rotate(120deg)}.petal:nth-child(4){transform:rotate(180deg)}.petal:nth-child(5){transform:rotate(240deg)}.petal:nth-child(6){transform:rotate(300deg)}.center{position:absolute;width:7px;height:7px;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;background:#f5d76b;box-shadow:0 0 9px 4px #f5d76b99}.firefly{position:absolute;width:4px;height:4px;border-radius:50%;background:#f5d36b;box-shadow:0 0 9px 3px #f5d36b88;opacity:0;animation:float 5s ease-in-out infinite}.scene.opened .firefly{opacity:.8;transition:opacity 2s 2s}@keyframes float{0%,100%{transform:translate(0,0);opacity:.2}50%{transform:translate(12px,-25px);opacity:1}}
.credit{position:absolute;z-index:6;bottom:14px;left:50%;transform:translateX(-50%);font:9px Arial,sans-serif;color:#b9c3cc;background:#0a2630b8;border:1px solid #5a9b9a44;padding:5px 10px;border-radius:20px;white-space:nowrap;opacity:.8}
@media(min-width:600px){.scene{max-width:430px;margin:auto;height:100svh;border-left:1px solid #ffffff0b;border-right:1px solid #ffffff0b}.garden{max-width:430px;left:50%;transform:translateX(-50%);width:100%}}
</style></head><body>
<main class="scene" id="scene"><div class="stars"></div><div class="glow"></div>
<section class="intro"><p id="introText">Have something</p><button class="open-btn" id="open">Open</button></section>
<section class="message"><h1>I LOVE U BABE</h1><p>YOU MAKE MY WORLD BEAUTIFUL</p></section>
<div class="garden" id="garden"></div><div class="credit">✦ made with love ✦</div></main>
<script>
const scene=document.getElementById('scene'),garden=document.getElementById('garden');
const blooms=[{x:16,h:'27%',y:0},{x:27,h:'20%',y:0},{x:39,h:'34%',y:0},{x:52,h:'24%',y:0},{x:65,h:'39%',y:0},{x:77,h:'28%',y:0},{x:88,h:'22%',y:0}];
blooms.forEach((b,i)=>{const f=document.createElement('div');f.className='flower';f.style.left=b.x+'%';f.style.setProperty('--h',b.h);f.style.transitionDelay=(.25+i*.22)+'s';f.innerHTML='<div class="stem"></div><i class="leaf" style="--y:25%;--x:-30px;--r:-25deg"></i><i class="leaf" style="--y:52%;--x:0px;--r:25deg"></i><div class="bloom">'+Array.from({length:6},()=>'<i class="petal"></i>').join('')+'<i class="center"></i></div>';garden.appendChild(f)});
for(let i=0;i<24;i++){const p=document.createElement('i');p.className='firefly';p.style.left=(8+Math.random()*84)+'%';p.style.top=(35+Math.random()*52)+'%';p.style.animationDelay=(Math.random()*5)+'s';p.style.animationDuration=(3+Math.random()*4)+'s';garden.appendChild(p)}
document.getElementById('open').addEventListener('click',()=>{scene.classList.add('opened');document.getElementById('introText').textContent='I love something'});
</script></body></html>
