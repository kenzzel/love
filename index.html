<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#03050b"><title>A Little Something For You</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03050b;color:#fff;font-family:Georgia,'Times New Roman',serif}body{position:relative;background:radial-gradient(ellipse at 50% 100%,#101a22 0,#070b13 38%,#03050b 78%)}
#sky,.stars,.fireflies{position:absolute;inset:0;pointer-events:none}.stars{background-image:radial-gradient(1px 1px at 10% 15%,#fff 90%,transparent),radial-gradient(1px 1px at 75% 22%,#fff 90%,transparent),radial-gradient(1.5px 1.5px at 43% 38%,#d9e8ff 90%,transparent),radial-gradient(1px 1px at 88% 61%,#fff 90%,transparent),radial-gradient(1px 1px at 23% 72%,#fff 90%,transparent),radial-gradient(1px 1px at 61% 82%,#fff 90%,transparent);background-size:230px 260px;animation:twinkle 4s ease-in-out infinite alternate;opacity:.7}.stars.s2{background-size:310px 370px;animation-duration:6s;opacity:.45;transform:translateY(20px)}
@keyframes twinkle{from{opacity:.25}to{opacity:.9}}
.heading{position:absolute;top:7%;left:0;width:100%;text-align:center;font-size:clamp(17px,5vw,25px);letter-spacing:.24em;font-weight:bold;text-shadow:0 0 7px #fff,0 0 18px #c8d9ff;opacity:0;transform:translateY(-10px);transition:1.5s ease;z-index:5}.heading.show{opacity:1;transform:none}
.intro{position:absolute;right:9%;top:39%;text-align:center;z-index:8;transition:1s ease}.intro p{font-size:clamp(16px,4.4vw,21px);letter-spacing:.16em;color:#dce1ed;text-shadow:0 0 12px #fff;margin:0 0 22px}.open{border:1px solid #ffffff45;background:linear-gradient(130deg,#ffffff16,#ffffff05);color:white;border-radius:30px;padding:11px 30px;font-size:13px;letter-spacing:.12em;box-shadow:0 0 18px #fff2;backdrop-filter:blur(8px);cursor:pointer}.open:active{transform:scale(.96)}.intro.hide{opacity:0;transform:translateY(20px);pointer-events:none}
.garden{position:absolute;bottom:-5px;left:50%;width:min(100vw,520px);height:46vh;transform:translateX(-50%);z-index:3}.flower{position:absolute;bottom:0;width:34%;height:100%;transform-origin:bottom center}.flower.one{left:12%;--delay:.2s;--height:78%}.flower.two{left:34%;--delay:.65s;--height:100%;transform:scale(.9)}.flower.three{left:57%;--delay:1s;--height:83%;transform:scale(.82)}
.stem{position:absolute;bottom:0;left:50%;width:3px;height:var(--height);background:linear-gradient(to top,#526d54,#c6d8b2);border-radius:100%;transform:scaleY(0);transform-origin:bottom;animation:grow 2.8s var(--delay) cubic-bezier(.2,.8,.2,1) forwards;filter:drop-shadow(0 0 5px #c5e6a4)}
@keyframes grow{to{transform:scaleY(1)}}.leaf{position:absolute;bottom:27%;left:50%;width:48px;height:16px;background:linear-gradient(90deg,#263f31,#a8c89b);border-radius:100% 0 100% 0;transform:rotate(-32deg) scale(0);transform-origin:left;animation:leaf .8s calc(var(--delay) + 1.7s) forwards;filter:drop-shadow(0 0 5px #a4d78c)}.leaf.l2{bottom:48%;transform:rotate(155deg) scale(0);animation-delay:calc(var(--delay) + 2s)}@keyframes leaf{to{transform:rotate(-32deg) scale(1)}.leaf.l2{}}
.bloom{position:absolute;left:50%;bottom:calc(var(--height) - 4px);width:76px;height:76px;transform:translate(-50%,50%) scale(0);animation:bloom 1.5s calc(var(--delay) + 2.4s) cubic-bezier(.2,.8,.2,1) forwards;filter:drop-shadow(0 0 10px #fff8)}@keyframes bloom{to{transform:translate(-50%,50%) scale(1)}}.petal{position:absolute;left:50%;top:50%;width:23px;height:35px;margin:-17px 0 0 -11px;border-radius:70% 70% 55% 55%;background:radial-gradient(ellipse at 50% 75%,#fff6b9 0,#fff 48%,#dfe8e8 100%);transform-origin:50% 95%;box-shadow:0 0 12px #fff9}.petal:nth-child(1){transform:rotate(0deg) translateY(-13px)}.petal:nth-child(2){transform:rotate(60deg) translateY(-13px)}.petal:nth-child(3){transform:rotate(120deg) translateY(-13px)}.petal:nth-child(4){transform:rotate(180deg) translateY(-13px)}.petal:nth-child(5){transform:rotate(240deg) translateY(-13px)}.petal:nth-child(6){transform:rotate(300deg) translateY(-13px)}.center{position:absolute;left:50%;top:50%;width:15px;height:15px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,#fff9c9,#f2d96e 70%);box-shadow:0 0 15px #fff8}
.grass{position:absolute;bottom:-3px;left:0;width:100%;height:28%;}.blade{position:absolute;bottom:0;left:var(--x);width:3px;height:var(--h);background:linear-gradient(to top,#263e32,#a9d19d);border-radius:100% 0;transform-origin:bottom;transform:rotate(var(--r)) scaleY(0);animation:grassgrow 2s calc(1.2s + var(--d)) forwards;filter:drop-shadow(0 0 4px #9bcf91)}@keyframes grassgrow{to{transform:rotate(var(--r)) scaleY(1)}}
.firefly{position:absolute;width:4px;height:4px;border-radius:50%;background:#f7d86b;box-shadow:0 0 8px 3px #e9c45b99;animation:float var(--t) ease-in-out infinite alternate;opacity:.0;animation-delay:var(--d)}@keyframes float{0%{opacity:0;transform:translate(0,20px)}35%{opacity:.9}100%{opacity:.2;transform:translate(var(--x),-65px)}}
.vignette{position:absolute;inset:0;pointer-events:none;background:linear-gradient(0deg,#03050b88,transparent 32%,transparent 75%,#03050b55);z-index:4}
@media(max-height:650px){.garden{height:42vh}.intro{top:34%}.heading{top:5%}}
</style></head>
<body><div id="sky"><div class="stars"></div><div class="stars s2"></div></div><div class="fireflies" id="fireflies"></div>
<div class="heading" id="heading">I LOVE U BABE</div><div class="intro" id="intro"><p>Have something</p><button class="open" id="open">Open</button></div>
<div class="garden" id="garden">
 <div class="flower one"><div class="stem"></div><i class="leaf"></i><i class="leaf l2"></i><div class="bloom"><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="center"></i></div></div>
 <div class="flower two"><div class="stem"></div><i class="leaf"></i><i class="leaf l2"></i><div class="bloom"><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="center"></i></div></div>
 <div class="flower three"><div class="stem"></div><i class="leaf"></i><i class="leaf l2"></i><div class="bloom"><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="center"></i></div></div>
 <div class="grass" id="grass"></div>
</div><div class="vignette"></div>
<script>
const heading=document.getElementById('heading'),intro=document.getElementById('intro');let opened=false;
document.getElementById('open').addEventListener('click',()=>{if(opened)return;opened=true;intro.classList.add('hide');setTimeout(()=>heading.classList.add('show'),450);document.body.classList.add('opened')});
const ff=document.getElementById('fireflies');for(let i=0;i<32;i++){const f=document.createElement('i');f.className='firefly';f.style.left=(8+Math.random()*84)+'%';f.style.top=(28+Math.random()*58)+'%';f.style.setProperty('--x',(Math.random()*70-35)+'px');f.style.setProperty('--t',(3+Math.random()*5)+'s');f.style.setProperty('--d',(-Math.random()*8)+'s');ff.appendChild(f)}
const grass=document.getElementById('grass');for(let i=0;i<27;i++){const b=document.createElement('i');b.className='blade';b.style.setProperty('--x',(i/27*100)+'%');b.style.setProperty('--h',(35+Math.random()*85)+'px');b.style.setProperty('--r',(Math.random()*70-35)+'deg');b.style.setProperty('--d',(Math.random()*1.5)+'s');grass.appendChild(b)}
</script></body></html>
